name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  # Fast gates: everything that does not need a production build or a browser.
  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install video preview dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run ai:assets
      - run: npm run typecheck
      - run: npm run extension:build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:branding
      - run: npm run verify:api
      - run: npm test
      - name: Validate image-based Compose configuration
        run: docker compose -f docker-compose.yaml config --quiet
  # One job per engine so they run in parallel and a failure reruns alone.
  browser:
    name: browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install video preview dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run ai:assets
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.engine }}
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify the WebKit compositor
        if: matrix.engine == 'webkit'
        run: node scripts/browser-webkit-runtime.mjs
      - name: Verify connected workflows and tag actions in ${{ matrix.engine }}
        env:
          NIVRA_AUDIT_ENGINE: ${{ matrix.engine }}
        run: |
          foundations_dir="$(mktemp -d /tmp/nivra-foundations.XXXXXX)"
          chmod 700 "$foundations_dir"
          export NIVRA_DATA_DIR="$foundations_dir/data"
          export NIVRA_PUBLIC_URL=http://localhost:3015
          export NIVRA_BROWSER_TEST_URL=http://localhost:3015
          export NIVRA_BROWSER_SESSION="$foundations_dir/browser-session.json"
          export NIVRA_AUDIT_WIDTHS=320,768,1440
          npm run start -- --port 3015 > "$RUNNER_TEMP/tag-actions-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3015/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3015/health > /dev/null
          node scripts/browser-foundations.mjs
          node scripts/browser-tag-actions.mjs
          node scripts/browser-local-ai.mjs
          if [ "$NIVRA_AUDIT_ENGINE" = chromium ]; then node scripts/browser-overview.mjs; fi
  onboarding:
    name: onboarding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install video preview dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run ai:assets
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify guided onboarding and installation instructions
        run: |
          export NIVRA_DATA_DIR="$(mktemp -d)"
          export NIVRA_PUBLIC_URL=http://localhost:3016
          export NIVRA_BROWSER_SESSION="$RUNNER_TEMP/onboarding-session.json"
          npm run start -- --port 3016 > "$RUNNER_TEMP/onboarding-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3016/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3016/health > /dev/null
          node scripts/browser-post-setup.mjs
  containers:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build and verify the source container
        run: |
          docker build --build-arg NIVRA_COMMIT="$GITHUB_SHA" -t nivra:ci .
          docker image inspect nivra:ci --format 'Image bytes: {{.Size}}'
          NIVRA_EXPECT_COMMIT="$GITHUB_SHA" node scripts/smoke-container.mjs nivra:ci
          docker run --rm --network none --cpus 1 --memory 1536m --memory-swap 1536m --read-only --tmpfs /tmp -e NIVRA_DATA_DIR=/tmp/ai-smoke --entrypoint node nivra:ci scripts/smoke-ai-runtime.mjs

      - name: Measure encrypted retrieval under the runtime resource limits
        run: |
          docker build --target build -t nivra:ci-build .
          exporter=$(docker create --entrypoint node nivra:ci-build scripts/build-ai-benchmark.mjs)
          trap 'docker rm -f "$exporter" >/dev/null 2>&1 || true' EXIT
          docker start --attach "$exporter"
          docker cp "$exporter:/tmp/nivra-ai-benchmark.mjs" "$RUNNER_TEMP/benchmark-ai.mjs"
          for chunks_per_item in 100 1; do
            docker run --rm --network none --cpus 1 --memory 1536m --memory-swap 1536m --read-only --tmpfs /tmp -v "$RUNNER_TEMP/benchmark-ai.mjs:/app/scripts/benchmark-ai.mjs:ro" --entrypoint node nivra:ci scripts/benchmark-ai.mjs 1000,10000,100000 "$chunks_per_item"
          done
