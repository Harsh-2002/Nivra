name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install video preview dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:branding
      - run: npm run verify:api
      - run: npm test
      - run: npm run build
      - name: Verify sidebar tag actions across browser engines
        run: |
          npx playwright install --with-deps chromium firefox webkit
          export NIVRA_DATA_DIR="$(mktemp -d)"
          export NIVRA_PUBLIC_URL=http://localhost:3015
          export NIVRA_BROWSER_SESSION="$RUNNER_TEMP/tag-actions-session.json"
          export NIVRA_AUDIT_WIDTHS=320,768,1440
          npm run start -- --port 3015 > "$RUNNER_TEMP/tag-actions-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3015/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3015/health > /dev/null
          for browser in chromium firefox webkit; do
            NIVRA_AUDIT_ENGINE="$browser" node scripts/browser-tag-actions.mjs
          done
      - name: Validate image-based Compose configuration
        run: docker compose config --quiet
      - name: Build and verify the source container
        run: |
          docker build -t nivra:ci .
          node scripts/smoke-container.mjs nivra:ci
