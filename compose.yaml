services:
  nivra:
    image: ghcr.io/harsh-2002/nivra:latest
    ports:
      - "0.0.0.0:${NIVRA_PORT:-3000}:3000"
    environment:
      NIVRA_DATA_DIR: /app/data
      NIVRA_PUBLIC_URL: ${NIVRA_PUBLIC_URL:-}
      NIVRA_ENCRYPTION_KEY_FILE: ${NIVRA_ENCRYPTION_KEY_FILE:-}
    volumes:
      - nivra-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nivra-data:
